# -Xmx8G + 4G metaspace asks for more than this 12 GB machine has once the
# Gradle daemon is up, and the build then dies in the Dart front end with
# "Could not start thread DartWorker" rather than an out-of-memory error.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation: plugin sources live on C:\ (pub cache)
# while the project is on D:\, and the incremental compiler crashes computing a
# cross-drive relative path (RelocatableFileToPathConverter).
kotlin.incremental=false
