# iOS builds for the App Store (no Mac needed). Codemagic builds on its macOS
# machines, signs with the certificate / profiles stored in Codemagic, and
# uploads the .ipa to App Store Connect. Store listing and "Submit for Review"
# are done in App Store Connect.
#
# Signing (personal account -> Settings -> Code signing identities):
#   certificate "vgo_dist" (Apple Distribution, generated by Codemagic, key kept
#   there) + App Store profiles "vgo_rider_appstore" / "vgo_captain_appstore".
#   The Apple team is capped at 3 distribution certs, so never let a build mint
#   a new one; renew these when they expire (Oct 2027).
# The App Store Connect key "ShoppingMarket ASC Key" is in the personal
# account's Developer Portal integration.
# Start a build: Codemagic -> V-Go -> Start new build -> pick the workflow.
#
# Android builds (same Mac machines; Linux is not on the free plan) produce
# signed .aab files to upload to Google Play by hand. The upload keystores live
# in Code signing identities -> Android keystores as "vgo_rider_upload" /
# "vgo_captain_upload". google-services.json is kept out of this public repo:
# it is the secure variable GOOGLE_SERVICES_JSON (base64) in the app's
# environment variable groups "vgo_rider_firebase" / "vgo_captain_firebase".

definitions:
  ios_env: &ios_env
    flutter: 3.41.9
    xcode: latest
    cocoapods: default
  android_env: &android_env
    flutter: 3.41.9
    java: 21
  scripts:
    - &android_keystore
      name: Release keystore
      script: |
        # Without key.properties Gradle quietly signs with debug keys, which
        # Play rejects, so stop here instead.
        if [ -z "$CM_KEYSTORE_PATH" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
          echo "No Android keystore: add it in Code signing identities" >&2
          exit 1
        fi
        printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
          "$CM_KEYSTORE_PASSWORD" "$CM_KEY_PASSWORD" "$CM_KEY_ALIAS" \
          "$CM_KEYSTORE_PATH" > android/key.properties
    - &google_services
      name: Firebase config
      script: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "No GOOGLE_SERVICES_JSON: add it to the app's variable group" >&2
          exit 1
        fi
        echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
    - &android_pub_get
      name: Flutter packages
      script: flutter pub get
    - &build_aab
      name: Build .aab
      script: |
        # Version codes only have to grow; Play had 31 when this was added, so
        # local builds must now go above 100 + the Codemagic run counter.
        flutter build appbundle --release \
          --build-name=$VERSION_NAME \
          --build-number=$((100 + BUILD_NUMBER))
    - &check_aab_signing
      name: Check release signing
      script: |
        keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
          | tee /tmp/aab_cert.txt
        if ! grep -q "SHA256" /tmp/aab_cert.txt || grep -q "Android Debug" /tmp/aab_cert.txt; then
          echo "The .aab is not signed with the upload key" >&2
          exit 1
        fi
    - &pub_get
      name: Flutter packages
      script: |
        # Plugins here are CocoaPods-only.
        flutter config --no-enable-swift-package-manager
        flutter pub get
        # rive_native (via awesome_dialog) downloads its native libs on first use;
        # left to its Xcode build phase it runs from ios/Pods and fails to find
        # pubspec.yaml ("ARCHIVE FAILED"), so set it up here, from the app root.
        dart run rive_native:setup --verbose --platform ios
    - &pods
      name: CocoaPods
      script: cd ios && pod install --repo-update
    - &use_profiles
      name: Apply signing profiles
      script: xcode-project use-profiles
    - &build_ipa
      name: Build .ipa
      script: |
        # Build numbers only have to grow; Codemagic's run counter does that.
        flutter build ipa --release \
          --build-number=$((1000 + BUILD_NUMBER)) \
          --export-options-plist=/Users/builder/export_options.plist
  publishing: &publishing
    app_store_connect:
      auth: integration
      submit_to_testflight: false
      submit_to_app_store: false

workflows:
  rider-ios:
    name: V-Go (rider) - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: V-Go
    integrations:
      app_store_connect: ShoppingMarket ASC Key
    environment:
      <<: *ios_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scooterapp.vgo
    scripts:
      - *pub_get
      - *pods
      - *use_profiles
      - *build_ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing: *publishing

  captain-ios:
    name: V-Go Captain - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: V-GoCaptain
    integrations:
      app_store_connect: ShoppingMarket ASC Key
    environment:
      <<: *ios_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scooterapp.vgo.vGoCaptain
    scripts:
      - *pub_get
      - *pods
      - *use_profiles
      - *build_ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing: *publishing

  rider-android:
    name: V-Go (rider) - Android Play Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: V-Go
    environment:
      <<: *android_env
      android_signing:
        - vgo_rider_upload
      groups:
        - vgo_rider_firebase
      vars:
        VERSION_NAME: 1.0.14
    scripts:
      - *android_keystore
      - *google_services
      - *android_pub_get
      - *build_aab
      - *check_aab_signing
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

  captain-android:
    name: V-Go Captain - Android Play Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: V-GoCaptain
    environment:
      <<: *android_env
      android_signing:
        - vgo_captain_upload
      groups:
        - vgo_captain_firebase
      vars:
        VERSION_NAME: 1.0.16
    scripts:
      - *android_keystore
      - *google_services
      - *android_pub_get
      - *build_aab
      - *check_aab_signing
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
