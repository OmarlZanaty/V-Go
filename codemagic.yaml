# iOS builds for the App Store (no Mac needed). Codemagic builds on its macOS
# machines, signs with the certificate / profiles stored in Codemagic, and
# uploads the .ipa to App Store Connect. Store listing and "Submit for Review"
# are done in App Store Connect.
#
# Signing (personal account -> Settings -> Code signing identities):
#   certificate "vgo_dist" (Apple Distribution, generated by Codemagic, key kept
#   there) + App Store profiles "vgo_rider_appstore" / "vgo_captain_appstore".
#   The Apple team is capped at 3 distribution certs, so never let a build mint
#   a new one; renew these when they expire (Oct 2027).
# The App Store Connect key "ShoppingMarket ASC Key" is in the personal
# account's Developer Portal integration.
# Start a build: Codemagic -> V-Go -> Start new build -> pick the workflow.

definitions:
  ios_env: &ios_env
    flutter: 3.41.9
    xcode: latest
    cocoapods: default
  scripts:
    - &pub_get
      name: Flutter packages
      script: |
        # Plugins here are CocoaPods-only.
        flutter config --no-enable-swift-package-manager
        flutter pub get
    - &pods
      name: CocoaPods
      script: cd ios && pod install --repo-update
    - &use_profiles
      name: Apply signing profiles
      script: xcode-project use-profiles
    - &build_ipa
      name: Build .ipa
      script: |
        # Build numbers only have to grow; Codemagic's run counter does that.
        flutter build ipa --release \
          --build-number=$((1000 + BUILD_NUMBER)) \
          --export-options-plist=/Users/builder/export_options.plist
  publishing: &publishing
    app_store_connect:
      auth: integration
      submit_to_testflight: false
      submit_to_app_store: false

workflows:
  rider-ios:
    name: V-Go (rider) - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: V-Go
    integrations:
      app_store_connect: ShoppingMarket ASC Key
    environment:
      <<: *ios_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scooterapp.vgo
    scripts:
      - *pub_get
      - *pods
      - *use_profiles
      - *build_ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing: *publishing

  captain-ios:
    name: V-Go Captain - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: V-GoCaptain
    integrations:
      app_store_connect: ShoppingMarket ASC Key
    environment:
      <<: *ios_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scooterapp.vgo.vGoCaptain
    scripts:
      - *pub_get
      - *pods
      - *use_profiles
      - *build_ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing: *publishing
