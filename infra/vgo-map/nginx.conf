# V-Go map style + OpenFreeMap tile cache (same setup as Cairo Shuttle's
# csb-tiles.conf). Edge Caddy hands vgo.almobarmg.com/map/* here (handle_path
# strips /map). The style is ours, so its look can change without an app
# release; tiles/fonts/sprites come from OpenFreeMap once, then from disk.
# Repeat views load faster and cached areas still draw if OpenFreeMap is down.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:50m
                 max_size=3g inactive=30d use_temp_path=off;

server {
    listen 8080;
    server_name _;

    location /styles/ {
        root /usr/share/nginx/map;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
    }

    proxy_ssl_server_name on;
    proxy_set_header Host tiles.openfreemap.org;
    proxy_cache tiles;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache $upstream_cache_status always;

    # TileJSON names weekly versioned tile URLs absolute to OpenFreeMap;
    # rewrite them back to /map/tiles on the asking host so tiles use the cache.
    location = /tiles/planet {
        proxy_pass https://tiles.openfreemap.org/planet;
        proxy_set_header Accept-Encoding "";
        proxy_cache_valid 200 1h;
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'https://tiles.openfreemap.org' '$http_x_forwarded_proto://$http_x_forwarded_host/map/tiles';
    }

    # Tiles, fonts, sprites: immutable under their versioned paths.
    location /tiles/ {
        proxy_pass https://tiles.openfreemap.org/;
        proxy_set_header Accept-Encoding gzip;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
    }
}
