# Runs on the prod server in /srv/vgo-map. Edge Caddy: vgo.almobarmg.com
# handle_path /map/* -> 127.0.0.1:8097.
services:
  vgo-map:
    image: nginx:1.27-alpine
    container_name: vgo-map
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./styles:/usr/share/nginx/map/styles:ro
      - tiles-cache:/var/cache/nginx/tiles
volumes:
  tiles-cache:
