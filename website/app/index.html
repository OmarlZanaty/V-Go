<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حمّل تطبيق V.Go</title>
  <meta name="theme-color" content="#030407">
  <link rel="canonical" href="https://vgo-eg.com/app/">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#030407;color:#f6f5ed;font-family:Tahoma,Arial,sans-serif;line-height:1.8}
    main{width:100%;max-width:460px;padding:32px 24px;text-align:center;background:#101215;border:1px solid #dce01e40;border-radius:24px}
    .brand{color:#dce01e;font:bold 48px/1.2 Arial,sans-serif;letter-spacing:-2px}
    h1{font-size:1.6rem;margin:20px 0 8px}
    p{color:#b2b5af;margin:0 0 24px}
    .store-buttons{display:grid;gap:14px}
    .store-badge{display:flex;align-items:center;justify-content:center;gap:14px;padding:16px;border:1px solid #dce01e60;border-radius:14px;color:#f6f5ed;text-decoration:none;min-height:80px}
    .store-badge.primary{background:#dce01e;color:#030407}
    .store-badge svg{width:27px;height:29px;flex-shrink:0}
    .store-badge span{display:flex;flex-direction:column;text-align:start;line-height:1.5}
    .store-badge small{font-size:.8rem}
    .store-badge b{font:700 22px/1.5 Arial,sans-serif}
    .store-badge:hover{border-color:#f6f5ed}
    .store-badge:focus-visible{outline:3px solid #dce01e;outline-offset:5px}
  </style>
</head>
<body>
  <main>
    <div class="brand" dir="ltr">V.Go</div>
    <h1>حمّل تطبيق <bdi>V.Go</bdi></h1>
    <p>تطبيق الركّاب — اختار متجر هاتفك وابدأ مشوارك.</p>
    <div class="store-buttons">
      <a class="store-badge primary" href="https://play.google.com/store/apps/details?id=com.scooterapp.vgo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3 16 12 4 21Z" fill="currentColor"/><path d="m5 2 15 8q3 2 0 4L5 22l10-10Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <span><small>حمّل التطبيق من</small><b dir="ltr">Google Play</b></span>
      </a>
      <a class="store-badge" href="https://apps.apple.com/app/id6820955516">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.6 1c.2 1.5-.5 3-1.4 4-.9 1-2.2 1.6-3.6 1.5-.2-1.4.5-2.9 1.4-3.9.9-1 2.4-1.7 3.6-1.6ZM20.6 17.4c-.5 1.2-.8 1.7-1.4 2.7-.9 1.3-2.1 2.9-3.6 2.9-1.3 0-1.7-.9-3.5-.9s-2.3.9-3.6.9c-1.5 0-2.6-1.5-3.4-2.8C2.7 16.5 2 11.3 3.5 8.9c1.1-1.7 2.7-2.7 4.4-2.7 1.5 0 2.5.9 3.8.9 1.2 0 2-.9 3.8-.9 1.4 0 2.9.8 4 2.1-3.4 1.9-2.8 6.8 1.1 9.1Z"/></svg>
        <span><small>حمّل التطبيق من</small><b dir="ltr">App Store</b></span>
      </a>
    </div>
  </main>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isApple = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      if (isApple) {
        window.location.replace('https://apps.apple.com/app/id6820955516');
      } else if (/Android/i.test(ua)) {
        window.location.replace('https://play.google.com/store/apps/details?id=com.scooterapp.vgo');
      }
    }());
  </script>
</body>
</html>
