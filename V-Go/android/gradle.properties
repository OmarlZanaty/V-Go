# -Xmx8G + 4G metaspace is more than this 12 GB machine can reserve once the
# Kotlin daemon starts too ("Could not reserve enough space for object heap").
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Opt out of the AGP new-DSL reader: this project uses the legacy Gradle DSL,
# which the Flutter Gradle plugin otherwise fails to read (evaluation NPE).
android.newDsl=false
# Disable Kotlin incremental compilation: the Flutter SDK / plugin sources live
# on C:\ while the project is on D:\, and the incremental compiler crashes
# computing a cross-drive relative path (RelocatableFileToPathConverter).
kotlin.incremental=false
# Low-memory build (12 GB RAM, page file on a full C:): compile Kotlin inside the
# Gradle daemon instead of a second JVM, and limit parallel workers.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
